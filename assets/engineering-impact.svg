<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-label="Historical results: 99.9 percent uptime, 60 percent less setup time, 40 percent higher release velocity, 35 percent lower MTTR"><rect width="1200" height="180" rx="18" fill="#0B1220"/><g font-family="Arial, Helvetica, sans-serif"><text x="150" y="85" text-anchor="middle" font-size="43" font-weight="700" fill="#5EEAD4">99.9%</text><text x="150" y="122" text-anchor="middle" font-size="12" letter-spacing="1.1" fill="#94A3B8">PRODUCTION UPTIME</text></g><g font-family="Arial, Helvetica, sans-serif"><text x="450" y="85" text-anchor="middle" font-size="43" font-weight="700" fill="#A78BFA">60%</text><text x="450" y="122" text-anchor="middle" font-size="12" letter-spacing="1.1" fill="#94A3B8">LESS SETUP TIME</text><path d="M300 40v100" stroke="#233047"/></g><g font-family="Arial, Helvetica, sans-serif"><text x="750" y="85" text-anchor="middle" font-size="43" font-weight="700" fill="#5EEAD4">40%</text><text x="750" y="122" text-anchor="middle" font-size="12" letter-spacing="1.1" fill="#94A3B8">HIGHER RELEASE VELOCITY</text><path d="M600 40v100" stroke="#233047"/></g><g font-family="Arial, Helvetica, sans-serif"><text x="1050" y="85" text-anchor="middle" font-size="43" font-weight="700" fill="#A78BFA">35%</text><text x="1050" y="122" text-anchor="middle" font-size="12" letter-spacing="1.1" fill="#94A3B8">LOWER MTTR</text><path d="M900 40v100" stroke="#233047"/></g></svg>